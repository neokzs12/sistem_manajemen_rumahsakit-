<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Ruangan</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<!-- ===================== NAVBAR ===================== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Rumah Sakit</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="/dokter">Dokter</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/pasien">Pasien</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/perawat">Perawat</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/obat">Obat</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/ruangan">Ruangan</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/transaksi">Transaksi</a>
                </li>

            </ul>

            <!-- LOGIN STATUS (Opsional) -->
            <span class="navbar-text text-white me-3" th:if="${session.Pasien != null}">
                Hi, <span th:text="${session.Pasien.nama}"></span>
            </span>

            <!-- Logout -->
            <a class="btn btn-outline-light" href="/logout">Logout</a>

        </div>
    </div>
</nav>
<!-- ================== END NAVBAR ===================== -->
<div class="container py-4">

    <h2 class="mb-4 text-center">Manajemen Ruangan</h2>

    <div class="row">

        <!-- ================= FORM ================= -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <strong>Form Ruangan</strong>
                </div>
                <div class="card-body">

                    <!-- ADD / EDIT FORM -->
                    <form th:action="@{/ruangan/submit}" th:object="${ruanganRec}" method="post">

                        <!-- Hidden ID -->
                        <input type="hidden" th:field="*{id}"/>

                        <!-- Tipe Ruangan -->
                        <div class="mb-3">
                            <label class="form-label">Tipe Ruangan</label>
                            <input type="text" class="form-control" th:field="*{tipe}"
                                   >
                        </div>

                        <!-- Button ADD -->
                        <button class="btn btn-success w-100 mb-2" name="add"
                                th:if="${ruanganRec.id == null}">
                            Tambah Ruangan
                        </button>

                        <!-- Button EDIT -->
                        <button class="btn btn-warning w-100 mb-2" 
                                th:if="${ruanganRec.id != null}"
                                th:formaction="@{'/ruangan/submit/' + ${ruanganRec.id}}"
                                name="edit">
                            Simpan Perubahan
                        </button>

                        <!-- Button DELETE -->
                        <button class="btn btn-danger w-100"
                                th:if="${ruanganRec.id != null}"
                                th:formaction="@{'/ruangan/submit/' + ${ruanganRec.id}}"
                                name="delete" onclick="return confirm('Yakin ingin menghapus pasien ini?');">
                            Hapus Ruangan
                        </button>

                    </form>

                </div>
            </div>
        </div>

        <!-- ================= TABLE ================= -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">
                    <strong>Daftar Ruangan</strong>
                </div>
                <div class="card-body">

                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-dark">
                        <tr class="text-center">
                            <th>ID</th>
                            <th>Tipe Ruangan</th>
                            <th>Aksi</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="r : ${ruanganList}">
                            <td th:text="${r.id}" class="text-center"></td>
                            <td th:text="${r.tipe}"></td>

                            <td class="text-center">
                                <a th:href="@{'/ruangan/' + ${r.id}}" class="btn btn-primary btn-sm">
                                    Edit
                                </a>
                            </td>
                        </tr>
                        </tbody>

                    </table>

                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
