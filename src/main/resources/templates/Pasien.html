<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Data Pasien</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- ===================== NAVBAR ===================== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Rumah Sakit</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="/dokter">Dokter</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/pasien">Pasien</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/perawat">Perawat</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/obat">Obat</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/ruangan">Ruangan</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/transaksi">Transaksi</a>
                </li>

            </ul>

            <!-- LOGIN STATUS (Opsional) -->
            <span class="navbar-text text-white me-3" th:if="${session.Pasien != null}">
                Hi, <span th:text="${session.Pasien.nama}"></span>
            </span>

            <!-- Logout -->
            <a class="btn btn-outline-light" href="/logout">Logout</a>

        </div>
    </div>
</nav>
<!-- ================== END NAVBAR ===================== -->

<div class="container py-4">
    <h2 class="mb-4 text-center">Manajemen Pasien</h2>

    <div class="row">
        <!-- ================== TABEL PASIEN ================== -->
        <div class="col-md-7">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <strong>Daftar Pasien</strong>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped mb-0">
                        <thead class="table-secondary">
                        <tr>
                            <th>ID</th>
                            <th>Nama</th>
                            <th>Penyakit</th>
                            <th>Aksi</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${pasienList}">
                            <td th:text="${p.id}"></td>
                            <td th:text="${p.nama}"></td>
                            <td th:text="${p.penyakit}"></td>
                            <td>
                                <a th:href="@{'/pasien/' + ${p.id}}" class="btn btn-sm btn-warning">Edit</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ================== FORM PASIEN ================== -->
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <strong>Form Pasien</strong>
                </div>
                <div class="card-body">

                    <form th:action="@{${pasienRec.id != null} ? '/pasien/submit/' + ${pasienRec.id} : '/pasien/submit'}"
                          th:object="${pasienRec}" method="post">

                        <!-- Nama -->
                        <div class="mb-3">
                            <label class="form-label">Nama Pasien</label>
                            <input type="text" class="form-control" th:field="*{nama}" placeholder="Masukkan nama" required>
                        </div>

                        <!-- Penyakit -->
                        <div class="mb-3">
                            <label class="form-label">Penyakit</label>
                            <input type="text" class="form-control" th:field="*{penyakit}" placeholder="Masukkan penyakit" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" name="add" class="btn btn-primary"
                                    th:if="${pasienRec.id == null}">Tambah</button>

                            <button type="submit" name="edit" class="btn btn-warning text-white"
                                    th:if="${pasienRec.id != null}">Update</button>

                            <button type="submit" name="delete" class="btn btn-danger"
                                    th:if="${pasienRec.id != null}"
                                    onclick="return confirm('Yakin ingin menghapus pasien ini?');">Hapus</button>

                            <a href="/pasien" class="btn btn-secondary">Reset</a>
                        </div>

                    </form>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
