<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<!-- ===================== NAVBAR ===================== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Rumah Sakit</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="/dokter">Dokter</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/pasien">Pasien</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/perawat">Perawat</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/obat">Obat</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/ruangan">Ruangan</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/transaksi">Transaksi</a>
                </li>

            </ul>

            <!-- LOGIN STATUS (Opsional) -->
            <span class="navbar-text text-white me-3" th:if="${session.Pasien != null}">
                Hi, <span th:text="${session.Pasien.nama}"></span>
            </span>

            <!-- Logout -->
            <a class="btn btn-outline-light" href="/logout">Logout</a>

        </div>
    </div>
</nav>
<!-- ================== END NAVBAR ===================== -->
<div class="container py-4">

    <h2 class="mb-4">Transaksi</h2>

    <div class="row">
        <!-- ================= FORM ================= -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">Form Transaksi</div>
                <div class="card-body">

                    <form th:action="@{/transaksi/submit}" th:object="${transaksiRec}" method="post">

                        <!-- Pasien -->
                        <div class="mb-3">
                            <label class="form-label">Pasien</label>
                            <select class="form-select" th:field="*{pasien}">
                                <option value=""> pilih pasien </option>
                                <option th:each="p : ${pasienList}" th:value="${p.id}" th:text="${p.nama}"></option>
                            </select>
                        </div>

                        <!-- Dokter -->
                        <div class="mb-3">
                            <label class="form-label">Dokter</label>
                            <select class="form-select" th:field="*{dokter}">
                                <option value=""> pilih dokter </option>
                                <option th:each="d : ${dokterList}" th:value="${d.id}"
                                        th:text="${d.nama + ' (' + d.spesialis + ')'}"></option>
                            </select>
                        </div>

                        <!-- Perawat -->
                        <div class="mb-3">
                            <label class="form-label">Perawat</label>
                            <select class="form-select" th:field="*{perawat}">
                                <option value=""> pilih perawat </option>
                                <option th:each="r : ${perawatList}" th:value="${r.id}" th:text="${r.nama}"></option>
                            </select>
                        </div>

                        <!-- Ruangan -->
                        <div class="mb-3">
                            <label class="form-label">Ruangan</label>
                            <select class="form-select" th:field="*{ruangan}">
                                <option value=""> pilih ruangan </option>
                                <option th:each="ru : ${ruanganList}" th:value="${ru.id}" th:text="${ru.tipe}"></option>
                            </select>
                        </div>

                        <!-- Obat -->
                        <div class="mb-3">
                            <label class="form-label">Obat</label>
                            <select class="form-select" id="obatSelect" th:field="*{obat}">
                                <option value=""> pilih obat </option>
                                <option th:each="o : ${obatList}" th:value="${o.id}"
                                        th:text="${o.nama + ' - Rp ' + o.harga}"
                                        th:data-harga="${o.harga}">
                                </option>
                            </select>
                        </div>

                        <!-- Jumlah -->
                        <div class="mb-3">
                            <label class="form-label">Jumlah</label>
                            <input type="number" min="1" class="form-control"
                                   th:field="*{jumlahHarga.jumlah}" id="jumlahObat">
                        </div>

                        <!-- Total -->
                        <div class="mb-3">
                            <label class="form-label">Total Harga</label>
                            <input class="form-control" id="totalHarga" th:value="*{total}" readonly>
                        </div>

                        <!-- TOMBOL -->
                        <div class="d-flex gap-2">
                            <!-- ADD -->
                            <button class="btn btn-success" name="add"
                                    th:if="${transaksiRec.id == null}">Tambah</button>

                            <!-- EDIT -->
                            <button class="btn btn-warning" th:if="${transaksiRec.id != null}" name="edit"
                                    th:formaction="@{'/transaksi/submit/' + ${transaksiRec.id}}">Simpan</button>

                            <!-- DELETE -->
                            <button class="btn btn-danger" th:if="${transaksiRec.id != null}" name="delete"
                                    th:formaction="@{'/transaksi/submit/' + ${transaksiRec.id}}"
                                    onclick="return confirm('Hapus transaksi ini?')">Hapus</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

        <!-- ================= TABLE ================= -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">Daftar Transaksi</div>
                <div class="card-body">

                    <table class="table table-bordered table-striped text-center">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Pasien</th>
                            <th>Dokter</th>
                            <th>Perawat</th>
                            <th>Ruangan</th>
                            <th>Obat</th>
                            <th>Jumlah</th>
                            <th>Total</th>
                            <th>Aksi</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="t : ${transaksiList}">
                            <td th:text="${t.id}"></td>

                            <!-- SAFE -->
                            <td th:text="${t.pasien?.nama}"></td>
                            <td th:text="${t.dokter?.nama}"></td>
                            <td th:text="${t.perawat?.nama}"></td>
                            <td th:text="${t.ruangan?.tipe}"></td>
                            <td th:text="${t.obat?.nama}"></td>

                            <!-- SAFE -->
                            <td th:text="${t.jumlahHarga != null ? t.jumlahHarga.jumlah : '-'}"></td>

                            <!-- SAFE -->
                            <td th:text="${'Rp ' + (t.total != null ? t.total : 0)}"></td>

                            <td>
                                <a th:href="@{'/transaksi/' + ${t.id}}" class="btn btn-sm btn-primary">Edit</a>
                            </td>
                        </tr>
                        </tbody>

                    </table>

                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
